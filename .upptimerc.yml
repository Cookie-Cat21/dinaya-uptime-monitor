owner: Cookie-Cat21
repo: dinaya-uptime-monitor

sites:
  # ── Public surface ─────────────────────────────────────────────────────────
  - name: Dinaya Web
    url: https://dinaya-lk.vercel.app
    expectedStatusCodes:
      - 200
  - name: Booking Page
    url: https://dinaya-lk.vercel.app/book
    expectedStatusCodes:
      - 200
  - name: Pricing Page
    url: https://dinaya-lk.vercel.app/pricing
    expectedStatusCodes:
      - 200

  # ── Auth + dashboard ───────────────────────────────────────────────────────
  - name: Dinaya Auth
    url: https://dinaya-lk.vercel.app/login
    expectedStatusCodes:
      - 200
  - name: Dashboard
    url: https://dinaya-lk.vercel.app/dashboard
    expectedStatusCodes:
      - 200
      - 302
      - 307

  # ── API surface ────────────────────────────────────────────────────────────
  - name: Dinaya API Health
    url: https://dinaya-lk.vercel.app/api/health
    expectedStatusCodes:
      - 200
  - name: PayHere Webhook
    url: https://dinaya-lk.vercel.app/api/webhooks/dodo
    method: GET
    expectedStatusCodes:
      - 405

  # ── External dependencies (deep health checks) ─────────────────────────────
  - name: Database (Neon)
    url: https://dinaya-lk.vercel.app/api/health/db
    expectedStatusCodes:
      - 200
  - name: Email (Resend)
    url: https://dinaya-lk.vercel.app/api/health/email
    expectedStatusCodes:
      - 200
  - name: Payments (PayHere)
    url: https://dinaya-lk.vercel.app/api/health/payments
    expectedStatusCodes:
      - 200

status-website:
  cname: status.dinaya-lk.vercel.app
  logoUrl: https://dinaya-lk.vercel.app/logo.png
  name: Dinaya Status
  introTitle: "**Dinaya Status** — real-time uptime and incident history"
  introMessage: This is the live status page for Dinaya. We monitor every endpoint from multiple regions every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/Cookie-Cat21/dinaya-uptime-monitor

assignees:
  - Cookie-Cat21

i18n:
  activeIncidents: Active incidents
  allSystemsOperational: All systems operational
  incidentReport: "Incident report:"
  incidentReportOn: "Incident report on"
  resolved: resolved
